<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Simma — join the table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg:           #F1E5C7;
    --paper:        #FAF3DE;
    --paper-2:      #F4ECCF;
    --border:       #D4C091;
    --border-soft:  #E4D6AC;
    --rule:         #C8B470;

    --ink:          #2A1F12;
    --ink-2:        #5C4A30;
    --ink-3:        #8A7656;
    --ink-4:        #B5A47E;

    --rust:         #B14A2C;
    --rust-deep:    #8E3A22;
    --rust-soft:    #F2D9C9;

    --teal:         #2D6E70;
    --teal-soft:    #D2E2DE;
    --teal-deep:    #1F5052;

    --mustard:      #C58A2C;
    --mustard-soft: #EDDCAE;

    --plum:         #6E3A5C;
    --plum-soft:    #E6D4DC;

    --radius:       6px;
    --radius-lg:    10px;

    --display:      "DM Serif Display", "Times New Roman", Georgia, serif;
    --sans:         "Work Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

    --base-fs:      16.5px;
    --max-w:        1180px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: var(--base-fs);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    background-image:
      radial-gradient(circle at 25% 15%, rgba(180,140,80,0.05) 0, transparent 60%),
      radial-gradient(circle at 80% 70%, rgba(160,110,60,0.04) 0, transparent 55%);
    min-height: 100vh;
  }

  img { display: block; max-width: 100%; }

  /* ─── Shared typography (mirrors Simma.html) ─────────────────────────── */
  .display { font-family: var(--display); font-weight: 400; letter-spacing: -0.01em; line-height: 1.05; }
  .display-italic { font-family: var(--display); font-style: italic; font-weight: 400; }
  .eyebrow {
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-2);
    display: inline-flex; align-items: center; gap: 8px;
  }
  .eyebrow-rust { color: var(--rust); }
  .eyebrow-teal { color: var(--teal); }
  .eyebrow-plum { color: var(--plum); }

  h1, h2, h3, h4 { margin: 0; }
  .h-hero    { font-family: var(--display); font-size: 76px; font-weight: 400; line-height: 1.0; letter-spacing: -0.02em; }
  .h-section { font-family: var(--display); font-size: 42px; font-weight: 400; line-height: 1.08; letter-spacing: -0.01em; }
  .h-card    { font-family: var(--display); font-size: 28px; font-weight: 400; line-height: 1.1; letter-spacing: -0.005em; }
  .h-small   { font-family: var(--display); font-size: 22px; font-weight: 400; line-height: 1.15; }
  .subtle    { color: var(--ink-2); }
  .muted     { color: var(--ink-3); }
  .story     { font-family: var(--display); font-style: italic; font-weight: 400; color: var(--ink-2); font-size: 19px; line-height: 1.5; }

  .rule-dot { display: inline-block; width: 4px; height: 4px; border-radius: 999px; background: var(--mustard); vertical-align: middle; }

  /* ─── Buttons ─────────────────────────────────────────────────────────── */
  .btn {
    appearance: none; border: 0; cursor: default;
    font-family: var(--sans); font-weight: 600; font-size: 15.5px;
    letter-spacing: 0.01em;
    border-radius: 999px;
    padding: 14px 22px;
    min-height: 50px;
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    transition: background 140ms ease, color 140ms ease, transform 120ms ease, border-color 140ms ease, opacity 140ms ease;
    white-space: nowrap;
  }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--rust); color: #FBF6E0; }
  .btn-primary:hover { background: var(--rust-deep); }
  .btn-ghost { background: var(--paper-2); color: var(--ink); border: 1px solid var(--border-soft); }
  .btn-ghost:hover { background: var(--paper); }
  .btn-lg { min-height: 58px; padding: 16px 26px; font-size: 16.5px; }
  .btn.is-disabled, .btn:disabled { opacity: 0.42; pointer-events: none; }

  .text-link {
    appearance: none; border: 0; background: none;
    font: inherit;
    color: var(--rust);
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
    cursor: default;
    padding: 0;
  }
  .text-link:hover { color: var(--rust-deep); }

  /* ─── Top bar ─────────────────────────────────────────────────────────── */
  .signup-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 40px;
    max-width: var(--max-w);
    margin: 0 auto;
  }
  .signup-top-aside { color: var(--ink-2); font-size: 14.5px; }
  .brand {
    font-family: var(--display);
    font-size: 32px;
    line-height: 1;
    color: var(--rust);
    letter-spacing: -0.015em;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    cursor: default;
  }
  .brand .brand-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 999px;
    background: var(--mustard);
    margin: 0 4px 0 2px;
    vertical-align: middle;
  }

  /* ─── Common shell ────────────────────────────────────────────────────── */
  .signup-page { min-height: 100vh; display: flex; flex-direction: column; }
  .signup-shell {
    width: 100%;
    max-width: var(--max-w);
    margin: 0 auto;
    padding: 24px 40px 80px;
  }
  @media (max-width: 720px) {
    .signup-top { padding: 20px; }
    .signup-shell { padding: 16px 20px 60px; }
  }

  /* ═══════════════════════════════════════════════════════════════════════
     ROLE PICKER
     ═══════════════════════════════════════════════════════════════════════ */
  .signup-role { padding-top: 28px; }
  .signup-eyebrow { margin-bottom: 18px; }
  .signup-h1 {
    max-width: 18ch;
    margin-bottom: 18px;
  }
  .signup-lead {
    max-width: 560px;
    margin: 0 0 44px;
    font-size: 21px;
  }
  .signup-fine {
    margin-top: 36px;
    color: var(--ink-3);
    font-size: 13.5px;
    max-width: 720px;
  }

  .role-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 28px;
  }
  @media (max-width: 880px) { .role-grid { grid-template-columns: 1fr; } }

  .role-card {
    appearance: none;
    text-align: left;
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0;
    cursor: default;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform 220ms ease, border-color 220ms ease, box-shadow 220ms ease;
    font: inherit;
    color: inherit;
  }
  .role-card:hover {
    border-color: var(--ink-3);
    transform: translateY(-3px);
    box-shadow: 0 12px 36px -16px rgba(60,40,20,0.22);
  }
  .role-card-host:hover  { border-color: var(--rust); }
  .role-card-learner:hover { border-color: var(--teal); }

  .role-photo {
    aspect-ratio: 16 / 9;
    position: relative;
    overflow: hidden;
    background: linear-gradient(140deg, var(--mustard) 0%, var(--rust) 100%);
    border-bottom: 1px solid var(--border);
  }
  .role-photo img {
    width: 100%; height: 100%;
    object-fit: cover;
    filter: saturate(0.88) sepia(0.08) contrast(1.02);
  }
  .role-tag {
    position: absolute; top: 14px; left: 14px;
    background: rgba(250,243,222,0.95);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-2);
  }
  .role-card-learner .role-photo {
    background: linear-gradient(140deg, var(--teal) 0%, var(--plum) 100%);
  }

  .role-body {
    padding: 28px 30px 30px;
    display: flex; flex-direction: column;
    gap: 14px;
    flex: 1;
  }
  .role-tagline {
    margin: -4px 0 4px;
    font-style: italic;
    font-family: var(--display);
    color: var(--ink-2);
    font-size: 19px;
    line-height: 1.3;
  }
  .role-text {
    margin: 0;
    color: var(--ink-2);
    font-size: 15.5px;
    line-height: 1.55;
  }
  .role-bullets {
    list-style: none;
    padding: 0;
    margin: 6px 0 4px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    font-size: 15px;
  }
  .role-bullets li {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--ink);
  }
  .role-check {
    width: 22px; height: 22px;
    border-radius: 999px;
    background: var(--mustard-soft);
    color: #7A5A20;
    display: inline-flex; align-items: center; justify-content: center;
    flex: 0 0 auto;
  }
  .role-card-learner .role-check { background: var(--teal-soft); color: var(--teal-deep); }
  .role-cta {
    margin-top: 12px;
    color: var(--rust);
    font-weight: 600;
    display: inline-flex; align-items: center; gap: 8px;
    border-top: 1px solid var(--border-soft);
    padding-top: 18px;
  }
  .role-card-learner .role-cta { color: var(--teal); }

  /* ═══════════════════════════════════════════════════════════════════════
     WIZARD
     ═══════════════════════════════════════════════════════════════════════ */
  .signup-wizard {
    max-width: 880px;
    margin: 0 auto;
    padding-top: 16px;
  }

  /* Progress */
  .progress-row {
    display: flex;
    align-items: center;
    gap: 22px;
    margin-bottom: 44px;
  }
  .progress-text {
    display: inline-flex;
    align-items: baseline;
    gap: 8px;
    flex: 0 0 auto;
    color: var(--ink-2);
    font-size: 14px;
  }
  .progress-num {
    font-family: var(--display);
    font-style: italic;
    font-size: 30px;
    color: var(--rust);
    line-height: 1;
  }
  .progress-of {
    font-size: 14px;
    color: var(--ink-3);
  }
  .progress-role {
    margin-left: 14px;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .progress-bar {
    flex: 1;
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 1fr;
    gap: 6px;
  }
  .prog-tick {
    height: 3px;
    border-radius: 999px;
    background: var(--border-soft);
    transition: background 240ms ease;
  }
  .prog-tick.is-done { background: var(--rust); }

  /* Screen transition */
  .wiz-screen {
    animation: wizIn 280ms cubic-bezier(.22,.61,.36,1);
  }
  .wiz-in-back { animation: wizInBack 280ms cubic-bezier(.22,.61,.36,1); }
  @keyframes wizIn {
    from { opacity: 0; transform: translateX(14px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes wizInBack {
    from { opacity: 0; transform: translateX(-14px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .wiz-head { margin-bottom: 30px; }
  .wiz-question {
    margin: 14px 0 12px;
    max-width: 22ch;
  }
  .wiz-helper {
    margin: 0;
    font-family: var(--display);
    font-style: italic;
    color: var(--ink-2);
    font-size: 19px;
    line-height: 1.5;
    max-width: 56ch;
  }
  .wiz-affirm {
    color: var(--ink-3);
    text-transform: none;
    letter-spacing: 0;
    font-size: 15px;
  }

  .wiz-body { margin-bottom: 36px; }

  /* Foot row */
  .wiz-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    padding-top: 24px;
    border-top: 1px solid var(--border-soft);
  }
  .wiz-back {
    appearance: none; border: 0; background: none;
    font: inherit;
    color: var(--ink-2);
    font-weight: 500;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 4px;
    cursor: default;
  }
  .wiz-back:hover { color: var(--ink); }
  .wiz-foot-right {
    display: inline-flex;
    align-items: center;
    gap: 22px;
  }

  /* ─── Inputs ──────────────────────────────────────────────────────────── */
  .input, .textarea {
    font-family: var(--sans); font-size: 17px; color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    min-height: 56px;
    width: 100%;
    outline: none;
    transition: border-color 120ms, box-shadow 120ms;
  }
  .input::placeholder, .textarea::placeholder { color: var(--ink-4); }
  .input:focus, .textarea:focus {
    border-color: var(--rust);
    box-shadow: 0 0 0 3px rgba(177,74,44,0.14);
  }
  .input-xl {
    font-family: var(--display);
    font-size: 28px;
    line-height: 1.2;
    padding: 22px 22px;
    min-height: 80px;
  }
  .textarea-xl {
    min-height: 180px;
    font-size: 18px;
    line-height: 1.5;
    resize: vertical;
  }

  .step-stack { display: flex; flex-direction: column; gap: 22px; }

  /* Example chips */
  .example-row { display: flex; flex-direction: column; gap: 10px; }
  .example-label, .prompts-label {
    font-family: var(--display);
    font-style: italic;
    color: var(--ink-3);
    font-size: 16px;
  }
  .example-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    appearance: none;
    font: inherit;
    background: var(--paper);
    color: var(--ink);
    border: 1px solid var(--border-soft);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 14px;
    font-weight: 500;
    cursor: default;
    display: inline-flex; align-items: center; gap: 6px;
    transition: background 120ms, border-color 120ms, color 120ms;
  }
  .chip-example:hover { border-color: var(--ink-3); background: var(--paper-2); }
  .chip-select:hover { border-color: var(--ink-3); }
  .chip-select.is-active {
    background: var(--ink); color: var(--paper); border-color: var(--ink);
  }
  .chip-check {
    display: inline-flex; align-items: center; justify-content: center;
    width: 14px; height: 14px;
  }

  /* Prompts under textarea */
  .prompts-row { display: flex; flex-direction: column; gap: 8px; padding: 16px 18px; background: var(--paper-2); border: 1px dashed var(--border); border-radius: var(--radius); }
  .prompts-list {
    list-style: none; margin: 0; padding: 0;
    display: flex; flex-direction: column; gap: 6px;
    color: var(--ink-2);
    font-size: 15px;
  }
  .prompts-bullet { color: var(--rust); margin-right: 4px; }

  .textarea-meta {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13.5px;
  }
  .multi-meta {
    display: flex; gap: 8px; align-items: center;
    font-size: 13.5px;
  }

  /* Option grid (single select) */
  .option-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  @media (max-width: 720px) { .option-grid { grid-template-columns: repeat(2, 1fr); } }

  .opt {
    appearance: none;
    font: inherit;
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    color: var(--ink);
    cursor: default;
    display: flex; align-items: center; gap: 12px;
    text-align: left;
    transition: border-color 140ms, background 140ms;
  }
  .opt:hover { border-color: var(--ink-3); }
  .opt.is-active { border-color: var(--rust); background: var(--rust-soft); }
  .opt-radio {
    width: 18px; height: 18px;
    border-radius: 999px;
    border: 1.5px solid var(--ink-3);
    background: var(--paper);
    display: inline-flex; align-items: center; justify-content: center;
    flex: 0 0 auto;
  }
  .opt.is-active .opt-radio { border-color: var(--rust); }
  .opt-radio-dot {
    width: 8px; height: 8px;
    border-radius: 999px;
    background: var(--rust);
  }
  .opt-label { font-size: 16px; font-weight: 500; }

  /* Chip grid (multi select) */
  .chip-grid {
    display: flex; flex-wrap: wrap; gap: 10px;
  }
  .chip-grid .chip-select {
    padding: 10px 16px;
    font-size: 15px;
  }
  .chip-custom .chip-x {
    margin-left: 6px;
    color: rgba(250,243,222,0.65);
    font-size: 16px;
    line-height: 1;
  }
  .chip-other {
    background: var(--paper);
    color: var(--ink-2);
    border: 1.5px dashed var(--border);
    padding: 9px 14px;
    font-size: 15px;
  }
  .chip-other:hover { border-color: var(--rust); color: var(--rust); }
  .chip-plus {
    display: inline-flex; align-items: center; justify-content: center;
    width: 16px; height: 16px;
    margin-right: 2px;
  }
  .chip-input-wrap {
    display: inline-flex;
    background: var(--paper);
    border: 1.5px solid var(--rust);
    box-shadow: 0 0 0 3px rgba(177,74,44,0.14);
    border-radius: 999px;
    padding: 0;
    overflow: hidden;
  }
  .chip-input {
    appearance: none; border: 0; outline: 0;
    font: inherit;
    background: transparent;
    color: var(--ink);
    padding: 9px 16px;
    font-size: 15px;
    min-width: 220px;
  }
  .chip-input::placeholder { color: var(--ink-4); }

  /* Frequency cards */
  .freq-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .freq-card {
    appearance: none; font: inherit;
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    text-align: left;
    cursor: default;
    display: flex; align-items: center; gap: 18px;
    transition: border-color 140ms, background 140ms;
  }
  .freq-card:hover { border-color: var(--ink-3); }
  .freq-card.is-active { border-color: var(--rust); background: var(--rust-soft); }
  .freq-radio {
    width: 22px; height: 22px;
    border-radius: 999px;
    border: 1.5px solid var(--ink-3);
    background: var(--paper);
    display: inline-flex; align-items: center; justify-content: center;
    flex: 0 0 auto;
  }
  .freq-card.is-active .freq-radio { border-color: var(--rust); }
  .freq-radio-dot {
    width: 10px; height: 10px;
    border-radius: 999px;
    background: var(--rust);
  }
  .freq-label { margin-bottom: 2px; }
  .freq-sub { font-size: 14.5px; }

  /* Photo step */
  .photo-row {
    display: grid;
    grid-template-columns: 1fr auto 1.4fr;
    gap: 28px;
    align-items: center;
  }
  @media (max-width: 720px) { .photo-row { grid-template-columns: 1fr; } }
  .photo-upload {
    appearance: none; font: inherit;
    background: var(--paper-2);
    border: 1.5px dashed var(--border);
    border-radius: var(--radius);
    padding: 32px 20px;
    cursor: default;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    color: var(--ink);
    transition: border-color 140ms, background 140ms;
  }
  .photo-upload:hover { border-color: var(--rust); background: var(--paper); }
  .photo-upload-ico {
    width: 44px; height: 44px;
    border-radius: 999px;
    background: var(--rust-soft);
    color: var(--rust-deep);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .photo-upload-label { font-weight: 600; font-size: 15.5px; }
  .photo-upload-sub { font-size: 13.5px; }
  .photo-or {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--ink-3);
    font-size: 16px;
    justify-content: center;
  }
  .photo-quick { display: flex; flex-direction: column; gap: 10px; }
  .photo-quick-label { font-size: 13.5px; font-style: italic; font-family: var(--display); }
  .photo-quick-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .photo-thumb {
    appearance: none; padding: 0; border: 2px solid transparent;
    border-radius: var(--radius);
    overflow: hidden;
    cursor: default;
    background: var(--paper-2);
    transition: border-color 140ms, transform 140ms;
  }
  .photo-thumb img {
    width: 100%; aspect-ratio: 1/1; object-fit: cover;
    filter: saturate(0.88) sepia(0.08);
  }
  .photo-thumb.is-active {
    border-color: var(--rust);
    transform: translateY(-2px);
  }

  /* ═══════════════════════════════════════════════════════════════════════
     FINAL CARD
     ═══════════════════════════════════════════════════════════════════════ */
  .final-wrap {
    max-width: 980px;
    margin: 0 auto;
    padding: 8px 0 80px;
  }
  .final-eyebrow { margin-bottom: 16px; }
  .final-h1 {
    margin-bottom: 14px;
  }
  .final-lead {
    margin: 0 0 36px;
    font-size: 20px;
    max-width: 56ch;
  }

  /* Host cookbook recipe card */
  .cookbook-card {
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 18px 60px -28px rgba(60,40,20,0.30);
    overflow: hidden;
    position: relative;
  }
  .cookbook-stamp {
    position: absolute;
    top: 20px; right: 22px;
    z-index: 2;
    display: flex; align-items: baseline; gap: 6px;
    color: var(--rust);
    font-size: 14px;
    letter-spacing: 0.04em;
  }
  .cookbook-stamp-num {
    font-family: var(--display);
    font-size: 26px;
    color: var(--rust);
  }
  .cookbook-grid {
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 0;
  }
  @media (max-width: 760px) { .cookbook-grid { grid-template-columns: 1fr; } }

  .cookbook-photo {
    position: relative;
    aspect-ratio: 4/5;
    overflow: hidden;
    border-right: 1px solid var(--border);
    background: var(--paper-2);
  }
  @media (max-width: 760px) {
    .cookbook-photo {
      aspect-ratio: 16/10;
      border-right: 0;
      border-bottom: 1px solid var(--border);
    }
  }
  .cookbook-photo img {
    width: 100%; height: 100%;
    object-fit: cover;
    filter: saturate(0.85) sepia(0.10) contrast(1.04);
  }
  .cookbook-photo-cap {
    position: absolute; left: 16px; bottom: 16px;
    background: rgba(42,31,18,0.55);
    color: rgba(250,243,222,0.95);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.02em;
  }
  .cookbook-body {
    padding: 36px 36px 32px;
    display: flex; flex-direction: column; gap: 18px;
  }
  .cookbook-dish { margin: 4px 0 6px; max-width: 18ch; }

  .cookbook-meta { display: flex; flex-direction: column; gap: 0; border-top: 1px solid var(--border-soft); border-bottom: 1px solid var(--border-soft); }
  .cookbook-meta-row {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid var(--border-soft);
    font-size: 15.5px;
  }
  .cookbook-meta-row:last-child { border-bottom: 0; }
  .meta-ico { color: var(--rust); display: inline-flex; }
  .meta-label-i {
    font-family: var(--display);
    font-style: italic;
    color: var(--ink-3);
    margin-right: 6px;
  }

  .cookbook-story {
    display: flex; gap: 14px; align-items: flex-start;
    padding-top: 4px;
  }
  .quote-mark {
    font-size: 60px;
    line-height: 0.6;
    color: var(--rust);
    flex: 0 0 auto;
  }
  .cookbook-story-text {
    margin: 0;
    color: var(--ink);
    font-size: 18px;
    line-height: 1.55;
    max-width: 60ch;
  }
  .cookbook-foot {
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 36px;
    border-top: 1px dashed var(--border);
    color: var(--ink-3);
    font-size: 13.5px;
    background: var(--paper-2);
  }
  .cookbook-credit {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-3);
  }

  /* Learner card */
  .learner-card {
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 18px 60px -28px rgba(60,40,20,0.30);
    padding: 30px;
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 30px;
    align-items: flex-start;
  }
  @media (max-width: 720px) { .learner-card { grid-template-columns: 1fr; } }

  .learner-card-left {
    display: flex; flex-direction: column; gap: 14px;
  }
  .learner-portrait {
    aspect-ratio: 1/1;
    border-radius: var(--radius);
    overflow: hidden;
    position: relative;
    border: 1px solid var(--border);
  }
  .learner-portrait img {
    width: 100%; height: 100%;
    object-fit: cover;
    filter: saturate(0.85) sepia(0.10) contrast(1.04);
  }
  .learner-portrait-frame {
    position: absolute; inset: 6px;
    border: 1px solid rgba(250,243,222,0.5);
    border-radius: 4px;
    pointer-events: none;
  }
  .learner-id { display: flex; flex-direction: column; gap: 2px; }
  .learner-name { line-height: 1.1; }

  .learner-card-right {
    display: flex; flex-direction: column; gap: 18px;
  }
  .learner-section { display: flex; flex-direction: column; gap: 8px; }
  .chip-row {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin-top: 6px;
  }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 12px;
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 500;
    background: var(--paper-2);
    color: var(--ink);
    border: 1px solid var(--border-soft);
  }
  .pill-teal { background: var(--teal-soft); color: var(--teal-deep); border-color: #BAD3CE; }

  .learner-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    padding-top: 14px;
    border-top: 1px solid var(--border-soft);
  }
  .bare-list {
    list-style: none; padding: 0; margin: 8px 0 0;
    display: flex; flex-direction: column; gap: 6px;
    font-size: 15px;
    color: var(--ink);
  }
  .bare-list li.muted { color: var(--ink-3); }

  /* Final actions */
  .final-actions {
    display: flex; gap: 14px; flex-wrap: wrap;
    margin-top: 28px;
  }
  .final-note {
    margin-top: 22px;
    font-size: 17px;
    max-width: 60ch;
  }

  /* Screen fade */
  .screen { animation: screenIn 320ms ease-out; }
  @keyframes screenIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Tweaks (mirror Simma) */
  body[data-text="m"]  { --base-fs: 16.5px; }
  body[data-text="l"]  { --base-fs: 18px;   }
  body[data-text="xl"] { --base-fs: 20px;   }

  body[data-accent="rust"]    { --rust: #B14A2C; --rust-deep: #8E3A22; --rust-soft: #F2D9C9; }
  body[data-accent="teal"]    { --rust: #2D6E70; --rust-deep: #1F5052; --rust-soft: #D2E2DE; }
  body[data-accent="mustard"] { --rust: #B07A1E; --rust-deep: #855B12; --rust-soft: #ECDAA8; }
  body[data-accent="plum"]    { --rust: #6E3A5C; --rust-deep: #4C2740; --rust-soft: #E6D4DC; }
</style>
</head>
